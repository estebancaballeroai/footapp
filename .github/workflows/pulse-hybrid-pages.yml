name: Fútbol Pulse - datos compartidos y Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.png'
      - '*.svg'
      - '*.webmanifest'
      - 'update_data.py'
      - '.github/workflows/pulse-hybrid-pages.yml'
  schedule:
    # Cada 6 horas. UTC; GitHub puede retrasar alguna ejecución.
    - cron: '19 */6 * * *'

concurrency:
  group: futbol-pulse-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar sitio estático
        run: |
          mkdir -p dist
          cp index.html app.js community.js pulse-hybrid.js style.css premium.css community.css sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png dist/
          touch dist/.nojekyll
      - name: Preparar caché comunitaria ESPN
        run: python update_data.py --output dist/pulse-data.json
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: prepare
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar Fútbol Pulse
        id: deployment
        uses: actions/deploy-pages@v4
